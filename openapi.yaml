swagger: "2.0"
info:
  title: API de Times de Futebol
  version: 1.0.0
  description: API para gerenciar times de futebol.
host: localhost:5001
schemes:
  - http
basePath: /
paths:
  /times:
    get:
      summary: Retorna todos os times
      responses:
        200:
          description: Lista de times
          schema:
            type: array
            items:
              $ref: '#/definitions/Time'
    post:
      summary: Cria um novo time
      parameters:
        - in: body
          name: body
          description: Dados do novo time
          required: true
          schema:
            $ref: '#/definitions/Time'
      responses:
        201:
          description: Time criado com sucesso
          schema:
            $ref: '#/definitions/Time'
  /times/{id}:
    get:
      summary: Retorna um time pelo ID
      parameters:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        200:
          description: Dados do time
          schema:
            $ref: '#/definitions/Time'
        404:
          description: Time não encontrado
          schema:
            $ref: '#/definitions/Error'
    put:
      summary: Atualiza um time pelo ID
      parameters:
        - name: id
          in: path
          required: true
          type: integer
        - in: body
          name: body
          description: Dados do time para atualização
          required: true
          schema:
            $ref: '#/definitions/Time'
      responses:
        200:
          description: Time atualizado com sucesso
          schema:
            $ref: '#/definitions/Time'
        404:
          description: Time não encontrado
          schema:
            $ref: '#/definitions/Error'
    delete:
      summary: Deleta um time pelo ID
      parameters:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        200:
          description: Time deletado com sucesso
          schema:
            $ref: '#/definitions/Message'
        404:
          description: Time não encontrado
          schema:
            $ref: '#/definitions/Error'

definitions:
  Time:
    type: object
    properties:
      id:
        type: integer
        readOnly: true
      nome:
        type: string
      pais:
        type: string
      ano_fundacao:
        type: integer
      estadio:
        type: string
      titulos:
        type: integer
  Error:
    type: object
    properties:
      message:
        type: string
  Message:
    type: object
    properties:
      message:
        type: string
